version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - SECRET_KEY=replace-me
      - DATABASE_URL=sqlite:///./data/dev.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
